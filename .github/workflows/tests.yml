name: Tests

on:
  push:
    branches: [ master, dev ]
  pull_request:
    branches: [ master, dev ]

jobs:

  # Built once from backend.pin - a jar is platform independent, so one build serves the matrix.
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build the pinned backend
        run: python scripts/backend_jar.py

      - uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: neuralogic/jar/NeuraLogic.jar
          retention-days: 1

  build:
    needs: backend
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: neuralogic/jar

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Setup Graphviz
        uses: ts-graphviz/setup-graphviz@v1

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest --cov=neuralogic --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v2
